[package]
name = "jev-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "0.42.2", features = ["responses"] }
axum = "0.8.9"
dotenvy = "0.15.7"
futures = "0.3.34"
jev-sdk = "0.1.0"
maud = { version = "0.27.0", features = ["axum"] }
